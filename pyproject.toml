[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trueeta"
version = "0.1.0"
description = "버스 도착 전광판 - 경기도 버스 API 회차대기 판정"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trueeta = ["web/*"]

[project.scripts]
trueeta = "trueeta.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
