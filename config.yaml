# 버스 전광판 설정
#
# 여기 적힌 stationId / routeId 는 2026-09-16 프로브로 확인한 실제 값이다.
# 다시 확인하려면:
#   python scripts/probe.py station-list --keyword "도담마을아이파크"
#   python scripts/probe.py arrivals --station 228001059 --routes 22,59
#
# staOrder / turnSeq / 첫차·막차는 여기 두지 않는다.
#   - staOrder, turnSeq 는 arrivals 응답에 매번 들어온다
#   - 첫차·막차·배차간격은 route-info 를 하루 1회 받아 캐시한다
# 값을 두 곳에 두면 한쪽이 먼저 낡는다.

# 프리셋 = 한 화면에 띄울 정류장·노선 묶음.
#
# default: true 는 키오스크가 상시 띄우는 것이다. 아무도 안 봐도 항상
# 폴링된다 — 여기서 빠지면 관측 로그 수집이 멈춘다.
# 나머지는 누가 /?preset=이름 으로 열어볼 때만 폴링한다.
#
# 호출은 정류장당 1건이다. 프리셋 둘이 같은 정류장을 써도 한 번만 부른다.
# 주기는 활성 정류장 수에서 역산한다 (config.intervals_for).
presets:
  - name: 집앞
    default: true
    stops:
      - station_id: 228001059
        name: 도담마을아이파크.죽전휴먼빌
        mobile_no: "29272"          # 정류장 표지판 번호
        note: 미금역 방향(22) · 수지구청 방향(59)
        routes: ["22", "59"]

      - station_id: 228003549
        name: 대일초교후문
        mobile_no: "56580"
        note: 미금역 방향(25)
        routes: ["25"]

  # 신분당선 타러 갈 때: 죽전에서 59 를 탈지, 미금까지 가서 22·25 를
  # 기다릴지 비교한다. 열어볼 때만 폴링되므로 평소 비용은 0이다.
  - name: 출근-신분당
    stops:
      - station_id: 228001059
        name: 도담마을아이파크.죽전휴먼빌
        note: 수지구청 방향(59)
        routes: ["59"]

      - station_id: 228003549
        name: 대일초교후문
        note: 미금역 방향(25)
        routes: ["25"]

display:
  vehicles_per_route: 2         # 노선당 다음 몇 대까지 표시할지
  countdown: true               # predictTimeSec 를 1초씩 깎아 보여줄지
  refresh_sec: 5                # 화면이 /api/board 를 다시 받는 주기

polling:
  # 운행시간 밖에는 조회하지 않는다 (개발계정 1,000건/일)
  # 실제 첫차/막차는 route-info 캐시에서 읽고, 여기 값은 그 바깥 울타리다.
  service_window:
    start: "05:50"
    end: "00:10"

  # 실제로 버스를 타는 시간대. 이 안에서는 peak 주기로 자주 조회한다.
  # 자정을 넘지 않으므로 service_window 와 달리 단순 구간이다.
  peak_window:
    start: "08:00"
    end: "18:00"

  # 개발계정 1,000건/일 기준. 1사이클 = 정류장 2곳 = 2콜.
  #   피크    08:00~18:00 = 36,000초 / 120초 = 300사이클 -> 600콜
  #   그 외   30,000초        / 600초 =  50사이클 -> 100콜
  #                                          합계 700콜 (여유 300)
  #
  # 균일 주기로는 같은 예산에서 180초(733콜)가 한계였다. 피크를 10시간으로
  # 좁히면 그 시간대만 2분 주기를 쓸 수 있다. 60초로 더 당기면 피크에서만
  # 1,200콜이라 한도를 넘는다.
  #
  # 화면이 조회 시각 기준으로 ETA 를 1초씩 깎지만, 실제 ETA 는 정차·신호 때문에
  # 시계보다 느리게 줄어든다. 주기가 길수록 이 낙관 편향이 쌓인다.
  # (10분 주기일 때 6분 경과 시점에 카카오맵 대비 2분 빨랐다)
  #
  # near 는 아직 폴러가 쓰지 않는다. 도착 임박 단축은 다음 단계.
  interval_sec:
    peak: 120                   # 피크 주기 (2분)
    far: 600                    # 그 외 주기 (10분)
    near: 60                    # 도착 임박 (미사용)
  near_threshold_sec: 180       # 이 시간 안으로 들어오면 near 주기로 (미사용)

judge:
  # 회차대기 판정. docs/architecture.md 3장 + judge.py 주석 참고.
  #
  # 시간표와 비교하지 않는다 — 마을버스는 정시 운행이 아니라 배차간격
  # 운행이라 "몇 시 몇 분 도착" 데이터가 GBIS/TAGO 어디에도 없다.
  # 대신 ETA 가 줄어드는 속도를 본다.
  #
  #   비율 = (이전 ETA - 현재 ETA) / 경과 시간
  #     정상 주행  0.6 ~ 1.0
  #     회차대기   0 근처
  #
  # 아래 두 값은 아직 근거가 없는 추정치다. var/observations.db 가 며칠
  # 쌓이면 scripts/analyze.py 로 실제 분포를 보고 정한다.
  stall_ratio: 0.3              # 이 비율 미만이면 '안 줄어든' 것으로 본다
  stall_seconds: 240            # 그 상태가 이만큼 이어지면 회차대기로 확정

  # 관측 로그. API 호출은 늘지 않는다 (받은 응답을 저장만 한다).
  log_observations: true
